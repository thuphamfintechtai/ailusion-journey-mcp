# CI/CD MCP server (FastMCP)
#
# - Push lên dev, pull request vào dev / main: pytest (tool ngoài được giả lập, không tốn quota).
# - Khi pull request dev -> main được merge: test lại đúng merge commit; xanh thì build Docker image
#   (ghcr.io, tag latest + sha-xxxxxxx), SSH vào server, cập nhật đúng merge commit, chạy lại
#   `compose.homelab.yaml` rồi chờ container `ailusion-mcp` healthy (lỗi thì in log và báo đỏ).
#   Test đỏ thì không deploy (repo private gói Free không bật được branch protection).
# - Chạy tay (Actions → CI/CD → Run workflow, ref = v1.1.0): test + build image cho bản đó.
# - Pull request từ nhánh khác vào main làm job kiểm tra thất bại, nên không merge được.
#
# Cần cấu hình trong environment production (Settings → Environments → production):
#   secrets  DEPLOY_HOST (ssh.ailusion.io.vn), DEPLOY_USER, DEPLOY_SSH_KEY,
#            CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
#   variable DEPLOY_DIR  thư mục git của repo trên server (mặc định /home/zuzu/ailusion-journey-mcp)
# Trên server: thư mục đó là bản clone của repo, có sẵn `.env.homelab`; DEPLOY_USER chạy được
# `docker` (thuộc nhóm docker) và `git fetch` được từ GitHub.

name: CI/CD

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag / nhánh / commit cần test + build image (VD v1.1.0); trống = nhánh đang chọn"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint + test
    # PR đóng: chỉ test lại khi đã merge vào main (trước khi deploy).
    if: >-
      github.event.action != 'closed' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Chỉ nhận pull request từ dev vào main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Chỉ nhận pull request từ dev vào main."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Test
        run: pytest


  image:
    name: Docker image (GitHub Packages)
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'closed' && github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || inputs.ref || github.ref }}
      - id: commit
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event.pull_request.merged == true }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
            type=semver,pattern={{version}},value=${{ inputs.ref }},enable=${{ startsWith(inputs.ref, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }},enable=${{ startsWith(inputs.ref, 'v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy homelab
    needs: test
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-mcp
      cancel-in-progress: false
    steps:
      - name: Deploy qua Cloudflare Tunnel
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/zuzu/ailusion-journey-mcp' }}
          DEPLOY_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CONTAINER: ailusion-mcp
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloudflared "https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64"
          chmod +x /tmp/cloudflared
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          /tmp/cloudflared access tcp --hostname "$DEPLOY_HOST" --url 127.0.0.1:2222 >/tmp/cloudflared.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/2222) >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "Cloudflare Tunnel không mở được cổng local"
            cat /tmp/cloudflared.log
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -p 2222 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@127.0.0.1" \
            bash -s -- "$DEPLOY_DIR" "$DEPLOY_SHA" "$CONTAINER" <<'REMOTE'
          set -euo pipefail
          DEPLOY_DIR=$1
          DEPLOY_SHA=$2
          CONTAINER=$3
          cd "$DEPLOY_DIR"
          test -f .env.homelab || { echo "Thiếu $DEPLOY_DIR/.env.homelab"; exit 1; }
          if [ -z "$DEPLOY_SHA" ]; then
            echo "Thiếu merge commit SHA"
            exit 1
          fi
          found=0
          for _ in $(seq 1 12); do
            git fetch --prune origin main
            if git cat-file -e "$DEPLOY_SHA^{commit}" 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = 1 || { echo "Không thấy commit $DEPLOY_SHA trên origin/main"; exit 1; }
          git checkout -q main
          git merge --ff-only "$DEPLOY_SHA"
          echo "Deploy $(git log --oneline -1)"
          docker compose --env-file .env.homelab -f compose.homelab.yaml up -d --build --remove-orphans
          status=starting
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo missing)
            [ "$status" = healthy ] || [ "$status" = unhealthy ] && break
            sleep 5
          done
          if [ "$status" != healthy ]; then
            echo "$CONTAINER: $status"
            docker compose --env-file .env.homelab -f compose.homelab.yaml ps
            docker logs --tail 100 "$CONTAINER"
            exit 1
          fi
          docker image prune -f >/dev/null
          echo "$CONTAINER healthy"
          REMOTE
