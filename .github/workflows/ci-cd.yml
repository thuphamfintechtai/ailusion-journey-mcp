# CI/CD MCP server (FastMCP)
#
# Nhánh: lập trình trên `dev` (mặc định), `main` chỉ để deploy (merge dev -> main qua PR).
#
# - Pull request / push lên dev hoặc main: pytest (tool ngoài được giả lập, không tốn quota).
# - Push / merge vào main, push tag v* (VD v1.2.0), hoặc chạy tay: build Docker image, đăng lên
#   GitHub Packages ghcr.io/thuphamfintechtai/ailusion-journey-mcp với tag 1.2.0, 1.2, latest
#   (main), sha-xxxxxxx. Chạy tay (Actions → CI/CD → Run workflow) với ref = v1.1.0 để build lại
#   image cho một bản cũ.
# - Push / merge vào main (sau khi CI xanh): SSH vào server, cập nhật code đúng commit vừa test, chạy
#   lại `compose.homelab.yaml` rồi chờ container `ailusion-mcp` healthy (lỗi thì in log và báo đỏ).
#
# Cần cấu hình trong repo (Settings → Secrets and variables → Actions):
#   secrets  DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key, public key nằm trong
#            ~/.ssh/authorized_keys của DEPLOY_USER trên server), DEPLOY_PORT (tuỳ chọn, mặc định 22)
#   variable DEPLOY_DIR  thư mục repo trên server (mặc định /opt/ailusion/ailusion-journey-mcp)
# Trên server: thư mục đó là bản clone của repo, có sẵn `.env.homelab`; DEPLOY_USER chạy được
# `docker` (thuộc nhóm docker) và `git fetch` được từ GitHub.

name: CI/CD

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag / nhánh / commit cần build image (VD v1.1.0); trống = nhánh đang chọn"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Test
        run: pytest


  image:
    name: Docker image (GitHub Packages)
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ inputs.ref }},enable=${{ startsWith(inputs.ref, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }},enable=${{ startsWith(inputs.ref, 'v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && inputs.ref == '' }}
            type=sha,prefix=sha-,enable=${{ !inputs.ref }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy homelab
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-mcp
      cancel-in-progress: false
    steps:
      - name: Deploy qua SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/ailusion/ailusion-journey-mcp' }}
          DEPLOY_SHA: ${{ github.sha }}
          CONTAINER: ailusion-mcp
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_DIR,DEPLOY_SHA,CONTAINER
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            test -f .env.homelab || { echo "Thiếu $DEPLOY_DIR/.env.homelab"; exit 1; }
            git fetch --prune origin main
            git checkout -q main
            git merge --ff-only "$DEPLOY_SHA"
            echo "Deploy $(git log --oneline -1)"
            docker compose --env-file .env.homelab -f compose.homelab.yaml up -d --build --remove-orphans
            status=starting
            for _ in $(seq 1 60); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo missing)
              [ "$status" = healthy ] || [ "$status" = unhealthy ] && break
              sleep 5
            done
            if [ "$status" != healthy ]; then
              echo "$CONTAINER: $status"
              docker compose --env-file .env.homelab -f compose.homelab.yaml ps
              docker logs --tail 100 "$CONTAINER"
              exit 1
            fi
            docker image prune -f >/dev/null
            echo "$CONTAINER healthy"
