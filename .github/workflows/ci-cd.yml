# CI/CD MCP server (FastMCP)
#
# Nhánh: lập trình trên `dev` (mặc định), `main` chỉ để deploy (merge dev -> main qua PR).
#
# - Pull request / push lên dev hoặc main: pytest (tool ngoài được giả lập, không tốn quota).
# - Push / merge vào main (sau khi CI xanh): SSH vào server, cập nhật code đúng commit vừa test, chạy
#   lại `compose.homelab.yaml` rồi chờ container `ailusion-mcp` healthy (lỗi thì in log và báo đỏ).
#
# Cần cấu hình trong repo (Settings → Secrets and variables → Actions):
#   secrets  DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key, public key nằm trong
#            ~/.ssh/authorized_keys của DEPLOY_USER trên server), DEPLOY_PORT (tuỳ chọn, mặc định 22)
#   variable DEPLOY_DIR  thư mục repo trên server (mặc định /opt/ailusion/ailusion-journey-mcp)
# Trên server: thư mục đó là bản clone của repo, có sẵn `.env.homelab`; DEPLOY_USER chạy được
# `docker` (thuộc nhóm docker) và `git fetch` được từ GitHub.

name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Test
        run: pytest


  deploy:
    name: Deploy homelab
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-mcp
      cancel-in-progress: false
    steps:
      - name: Deploy qua SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/ailusion/ailusion-journey-mcp' }}
          DEPLOY_SHA: ${{ github.sha }}
          CONTAINER: ailusion-mcp
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_DIR,DEPLOY_SHA,CONTAINER
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            test -f .env.homelab || { echo "Thiếu $DEPLOY_DIR/.env.homelab"; exit 1; }
            git fetch --prune origin main
            git checkout -q main
            git merge --ff-only "$DEPLOY_SHA"
            echo "Deploy $(git log --oneline -1)"
            docker compose --env-file .env.homelab -f compose.homelab.yaml up -d --build --remove-orphans
            status=starting
            for _ in $(seq 1 60); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo missing)
              [ "$status" = healthy ] || [ "$status" = unhealthy ] && break
              sleep 5
            done
            if [ "$status" != healthy ]; then
              echo "$CONTAINER: $status"
              docker compose --env-file .env.homelab -f compose.homelab.yaml ps
              docker logs --tail 100 "$CONTAINER"
              exit 1
            fi
            docker image prune -f >/dev/null
            echo "$CONTAINER healthy"
